name: Update flake.lock

# Opens (or refreshes) a PR that bumps every input; the PR's own pull_request
# runs of Check and Darwin cache test it. This replaces trfwsl's daily push to
# main, so a bump reaches main only through a merge. GitHub held the first
# bump PR's runs for approval, since the repo requires it for first-time
# contributors and github-actions[bot] had no merged commit yet.
on:
    schedule:
        # Mondays and Thursdays, UTC; off the hour, when GitHub delays
        # scheduled runs most.
        - cron: "17 9 * * 1,4"
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    lockfile:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: samueldr/lix-gha-installer-action@v2026-06-15

            - uses: DeterminateSystems/update-flake-lock@v29
              with:
                  commit-msg: Update flake.lock
                  pr-title: Update flake.lock
