name: Auto-update watchdog

# Update flake.lock (update-flake-lock.yml) opens a lock-bump PR on Mondays and
# Thursdays, and a merge lands it on main. This fails, and GitHub mails whoever
# last edited the cron line, once main's flake.lock has gone 10 days without a
# change: the bump workflow is failing, or its PRs aren't being merged.
on:
    schedule:
        # UTC, off the hour, when GitHub delays scheduled runs most.
        - cron: "17 14 * * *"
    workflow_dispatch:

jobs:
    lock-age:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            # Two bumps a week plus a manual merge: one missed or late bump
            # passes, three in a row fail.
            - name: Check main's last flake.lock change
              run: |
                  last=$(git log -1 --format=%ct -- flake.lock)
                  : "${last:?no commit touches flake.lock}"
                  days=$((($(date +%s) - last) / 86400))
                  echo "flake.lock last changed on main ${days} days ago"
                  if [ "$days" -ge 10 ]; then
                      echo "::error::flake.lock unchanged on main for ${days} days; merge the open Update flake.lock PR or read that workflow's runs"
                      exit 1
                  fi
