name: Darwin cache

# Builds trfmbp's expensive, free derivations that cache.nixos.org lacks and
# pushes them to tomrfitz.cachix.org, so the Mac's switches download them
# instead of compiling (scripts/build-uncached.sh has the why of the
# allowlist). cachix-action's default daemon mode pushes only what this job
# builds, never what it substitutes.
#
# A run where nothing allowlisted changed finds it all cached and stops after
# evaluation. The first cold run (2026-10-23) built 606 derivations in 19 min
# and grew /nix to 6.9 GiB of the runner's 96 GiB free.
on:
    push:
        branches: [main]
        paths-ignore: ["**.md"]
    pull_request:
        paths-ignore: ["**.md"]
    # update-flake-lock.yml dispatches this on its PR branch, since a PR
    # opened with GITHUB_TOKEN triggers no pull_request run.
    workflow_dispatch:

# A newer push to the same branch supersedes a running build.
concurrency:
    group: darwin-cache-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: macos-latest
        timeout-minutes: 240
        steps:
            - uses: actions/checkout@v6

            - uses: samueldr/lix-gha-installer-action@v2026-06-15

            - uses: cachix/cachix-action@v17
              with:
                  name: tomrfitz
                  extraPullNames: nix-community
                  authToken: ${{ secrets.CACHIX }}

            - name: Disk before
              run: df -h / /nix

            # What the Mac compiles today, all free software; keep it to names
            # whose licence is known, since anything matched goes public.
            - name: Build uncached allowlisted derivations
              run: ./scripts/build-uncached.sh .#darwinConfigurations.trfmbp.system 'paneru|sgram-tui|emacs-|package-build-|tesseract-|aspell-'

            - name: Disk after
              if: always()
              run: |
                  df -h / /nix
                  du -sh /nix/store
